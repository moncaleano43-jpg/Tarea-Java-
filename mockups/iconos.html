<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cifra · Iconos</title>
<link rel="stylesheet" href="../styles.css">
<style>
body{padding:56px 20px}
.wrap{max-width:1080px;margin:auto}
h1{font-size:34px;font-weight:650;letter-spacing:-.035em}
.sub{color:var(--muted);margin:6px 0 36px}
h2{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin:38px 0 14px}
.set{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.cell{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 12px 16px;text-align:center}
.cell .ico{margin:0 auto 14px}
.cell span{font-size:12.5px;color:var(--muted)}
.cell svg{width:24px;height:24px}
.sizes{display:flex;gap:28px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px}
.sizes svg{stroke:var(--text);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.sizes div{text-align:center;font-size:12px;color:var(--muted)}
.sizes svg{display:block;margin:0 auto 8px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:14px}
.pill svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.pill.dark{background:var(--text);color:var(--bg);border-color:var(--text)}
.ok svg{stroke:var(--pos)}
@media(max-width:800px){.set{grid-template-columns:repeat(3,1fr)}}
</style></head><body>
<div class="wrap">
<h1>Iconos de Cifra</h1>
<p class="sub">Trazo fino de 1,6 px, cuadrícula de 24 px, esquinas redondeadas y un solo color: tinta sobre papel.</p>

<h2>Funciones</h2>
<div class="set" id="f"></div>
<h2>Interfaz</h2>
<div class="set" id="u"></div>
<h2>Tamaños</h2>
<div class="sizes" id="s"></div>
<h2>En uso</h2>
<div class="row" id="r"></div>
</div>
<script>
const P={
 'Ingreso':'<path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/>',
 'Análisis':'<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4M8.5 12.5l2-2.5 1.5 1.5 2-3"/>',
 'Proyección':'<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>',
 'Gráficas':'<path d="M5 21V10M12 21V4M19 21v-8"/>',
 'Excel y CSV':'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M4 10h16M4 15h16M10 4v16"/>',
 'Privacidad':'<rect x="5" y="11" width="14" height="10" rx="3"/><path d="M8 11V8a4 4 0 018 0v3"/>',
 'Buscar':'<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/>',
 'Tema':'<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 000 16z" fill="currentColor"/>',
 'Agregar':'<path d="M12 5v14M5 12h14"/>',
 'Cerrar':'<path d="M6 6l12 12M18 6L6 18"/>',
 'Confirmar':'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
 'Deshacer':'<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/>',
 'Descargar':'<path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/>',
 'Importar':'<path d="M12 15V4m0 0L8 8m4-4l4 4M5 20h14"/>',
 'Escenarios':'<path d="M4 18c4-1 6-6 8-8s5-3 8-4"/><path d="M4 18c4 0 6 0 8-1s5-2 8-1" stroke-dasharray="2 3"/>',
 'Comandos':'<path d="M9 9V7a2 2 0 10-2 2h2zm0 0h6m-6 0v6m6-6V7a2 2 0 112 2h-2zm0 0v6m0 0h-6m6 0v2a2 2 0 102-2h-2zm-6 0v2a2 2 0 11-2-2h2z"/>',
 'Alerta':'<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17.2v.1"/>',
 'Ayuda':'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 114 2c-.9.6-1.5 1-1.5 2M12 17.2v.1"/>'
};
const svg=(d,c='')=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const grp=(ids,el)=>document.getElementById(el).innerHTML=ids.map(k=>`<div class="cell"><div class="ico">${svg(P[k])}</div><span>${k}</span></div>`).join('');
grp(['Ingreso','Análisis','Proyección','Gráficas','Excel y CSV','Privacidad'],'f');
grp(['Buscar','Tema','Agregar','Cerrar','Confirmar','Deshacer','Descargar','Importar','Escenarios','Comandos','Alerta','Ayuda'],'u');
document.getElementById('s').innerHTML=[16,20,24,32,48].map(n=>`<div><svg width="${n}" height="${n}" viewBox="0 0 24 24">${P['Proyección']}</svg>${n}px</div>`).join('');
document.getElementById('r').innerHTML=
 `<span class="pill dark">${svg(P['Agregar'])}Agregar periodo</span>
  <span class="pill">${svg(P['Descargar'])}Descargar PNG</span>
  <span class="pill">${svg(P['Importar'])}Importar CSV</span>
  <span class="pill">${svg(P['Deshacer'])}Deshacer</span>
  <span class="pill ok">${svg(P['Confirmar'])}Proyección lista</span>
  <span class="pill">${svg(P['Buscar'])}Buscar<kbd class="kbd" style="margin-left:6px">⌘K</kbd></span>`;
document.querySelectorAll('.pill svg').forEach(s=>s.removeAttribute('stroke-width'));
</script>
</body></html>
